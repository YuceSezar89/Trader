# Pre-commit hooks for TRader Panel Python project
# Install: pip install pre-commit && pre-commit install

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # NOT: "--extend-ignore=E203,W503" tırnaksız yazılırsa YAML bunu virgülden
        # ikiye böler, W503 ayrı bir arg (dosya adı sanılıp E902 ile çöker) olur —
        # 2 Ağu 2026, CI'ın haftalardır kırık olmasının kök nedenlerinden biri.
        args: [--max-line-length=100, "--extend-ignore=E203,W503"]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
      # Ensure files end with newline
      - id: end-of-file-fixer
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check YAML syntax
      - id: check-yaml
      # Check JSON syntax
      - id: check-json
      # Check for large files
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Check Python AST
      - id: check-ast
      # Check for debug statements
      - id: debug-statements

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        # pbr, bandit 1.7.5'in kendi bağımlılık zincirinde ama hook ortamına
        # otomatik gelmiyor — pinned sürümle "ModuleNotFoundError: No module
        # named 'pbr'" ile çöküyordu (2 Ağu 2026).
        additional_dependencies: [pbr]
        args: [-r, ., -f, json, -o, bandit-report.json, -x, "./.venv,./research,./graphify-out"]
        # -r . zaten tüm depoyu tarıyor — pre-commit'in ayrıca eşleşen dosya
        # adlarını da argüman olarak eklemesi "unrecognized arguments" ile
        # çöküyordu (aynı kök neden zincirinin devamı, 2 Ağu 2026). pass_filenames:
        # false sonrası pre-commit'in genel exclude'u artık uygulanmadığı için
        # -x ile .venv/research/graphify-out açıkça hariç tutuluyor — yoksa
        # binlerce üçüncü-parti/önbellek dosyası taranıp hook dakikalarca asılı
        # kalıyordu.
        pass_filenames: false
        exclude: ^tests/

  # Documentation
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google]
        exclude: ^(tests/|migrations/)

# Configuration for specific tools
default_language_version:
  python: python3

# Files to exclude from all hooks
exclude: |
  (?x)^(
    \.venv/.*|
    \.git/.*|
    \.mypy_cache/.*|
    __pycache__/.*|
    \.pytest_cache/.*|
    logs/.*|
    \.log$|
    migrations/.*\.sql$|
    inceleme/.*\.txt$
  )$
